<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet"
            href="{{ url_for('static', filename='css/js/style.css') }}">

</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            🎓 EduGenie
        </div>

        <div class="tagline">
            Your AI Learning Assistant
        </div>

    </header>


    <!-- Main Application -->

    <main class="container">

        <!-- Welcome -->

        <section class="hero">

            <h1>
                Learn Smarter with EduGenie
            </h1>

            <p>
                Ask questions, summarize study material,
                and generate quizzes using AI.
            </p>

        </section>


        <!-- Controls -->

        <section class="controls">

            <div class="control-group">

                <label for="subject">
                    Subject
                </label>

                <select id="subject">

                    <option value="General">
                        General
                    </option>

                    <option value="Artificial Intelligence">
                        Artificial Intelligence
                    </option>

                    <option value="Machine Learning">
                        Machine Learning
                    </option>

                    <option value="Python">
                        Python
                    </option>

                    <option value="Database Management">
                        Database Management
                    </option>

                    <option value="Computer Networks">
                        Computer Networks
                    </option>

                    <option value="Natural Language Processing">
                        NLP
                    </option>

                    <option value="Data Structures">
                        Data Structures
                    </option>

                </select>

            </div>


            <div class="control-group">

                <label for="level">
                    Student Level
                </label>

                <select id="level">

                    <option value="School">
                        School
                    </option>

                    <option value="College" selected>
                        College
                    </option>

                    <option value="University">
                        University
                    </option>

                </select>

            </div>

        </section>


        <!-- Ask AI -->

        <section class="card">

            <h2>
                🤖 Ask EduGenie
            </h2>

            <textarea
                id="question"
                placeholder="Ask anything about your subject..."
            ></textarea>

            <button
                id="askButton"
                onclick="askQuestion()"
            >
                Ask EduGenie
            </button>

        </section>


        <!-- Answer -->

        <section
            id="answerSection"
            class="card result-card hidden"
        >

            <h2>
                💡 AI Answer
            </h2>

            <div
                id="answer"
                class="result"
            ></div>

        </section>


        <!-- Summarizer -->

        <section class="card">

            <h2>
                📝 Study Material Summarizer
            </h2>

            <textarea
                id="summaryText"
                placeholder="Paste your study material here..."
            ></textarea>

            <button
                onclick="summarizeText()"
            >
                Summarize
            </button>

        </section>


        <!-- Summary Result -->

        <section
            id="summarySection"
            class="card result-card hidden"
        >

            <h2>
                📚 Summary
            </h2>

            <div
                id="summaryResult"
                class="result"
            ></div>

        </section>


        <!-- Quiz -->

        <section class="card">

            <h2>
                🧠 AI Quiz Generator
            </h2>

            <input
                type="text"
                id="quizTopic"
                placeholder="Enter quiz topic"
            >

            <select id="quizNumber">

                <option value="5">
                    5 Questions
                </option>

                <option value="10">
                    10 Questions
                </option>

                <option value="15">
                    15 Questions
                </option>

            </select>

            <button
                onclick="generateQuiz()"
            >
                Generate Quiz
            </button>

        </section>


        <!-- Quiz Result -->

        <section
            id="quizSection"
            class="card result-card hidden"
        >

            <h2>
                🎯 Generated Quiz
            </h2>

            <div
                id="quizResult"
                class="result"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            EduGenie © 2026 | Powered by Google Gemini
        </p>

    </footer>


    <script
        src="{{ url_for('static', filename='css/js/app.js') }}">
    </script>

</body>

</html>
